services:

  db:
    image: mysql:8.0
    container_name: railway_db_container
    restart: always
    environment:
      MYSQL_DATABASE: railway_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3306}:3306"

    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: railway_backend_container
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: railway_db
      DB_USER: root
      DB_PASSWORD: root
      DB_PORT: 3306
      PORT: 5000
    ports:
      - "${BACKEND_PORT:-5000}:5000"


  frontend:
    build: ./frontend
    container_name: railway_frontend_container
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"


volumes:
  db_data:
